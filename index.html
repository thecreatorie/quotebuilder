<!DOCTYPE html>
<html class="staticrypt-html">
    <head>
        <meta charset="utf-8" />
        <title>LED Project Quote Builder</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- do not cache this page -->
        <meta http-equiv="cache-control" content="max-age=0" />

        <style>
            @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Space+Grotesk:wght@400;500;700&display=swap');
            .staticrypt-html{height:100%}
            .staticrypt-body{height:100%;margin:0;background:#05070F;color:#FFFFFF;font-family:"Space Grotesk",system-ui,sans-serif}
            .staticrypt-content{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px 16px;box-sizing:border-box;
              background:#05070F radial-gradient(ellipse at 50% 0%, rgba(42,127,255,.22), transparent 60%)}
            .staticrypt-page{width:100%;max-width:420px}
            .staticrypt-form{background:#0A1020;border:1px solid #1C2A4D;border-radius:10px;padding:34px 32px 30px;text-align:center;
              box-shadow:0 0 40px rgba(92,241,255,.12)}
            .staticrypt-logo{width:240px;max-width:100%;height:auto;display:block;margin:0 auto 18px}
            .staticrypt-hr{height:3px;border:0;margin:0 0 22px;background:linear-gradient(120deg,#5CF1FF 0%,#2A7FFF 45%,#8A2BFF 80%,#FF2ED1 100%)}
            .staticrypt-title{font-family:"Orbitron",sans-serif;font-size:17px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#5CF1FF;margin:0 0 8px}
            .staticrypt-instructions p:last-child{margin:0 0 20px;color:#BFE3FF;font-size:14px}
            .staticrypt-password-container{position:relative;background:#111A33;border:1px solid #1C2A4D;border-radius:6px;margin:0 0 14px;box-sizing:border-box}
            .staticrypt-password-container:focus-within{border-color:#5CF1FF;box-shadow:0 0 0 2px rgba(92,241,255,.25)}
            .staticrypt-form input[type="password"],.staticrypt-form input[type="text"]{background:transparent;border:0;outline:0;color:#FFFFFF;font:16px "Space Grotesk",sans-serif;padding:14px 44px 14px 14px;width:100%;box-sizing:border-box}
            .staticrypt-toggle-password-visibility{cursor:pointer;height:18px;width:18px;opacity:.6;padding:13px;position:absolute;right:0;top:50%;transform:translateY(-50%);filter:invert(1)}
            label.staticrypt-remember{display:flex;align-items:center;gap:10px;margin:0 0 16px;font-size:13px;color:#BFE3FF}
            .staticrypt-remember input[type="checkbox"]{width:16px;height:16px;accent-color:#2A7FFF;margin:0}
            .staticrypt-form .staticrypt-decrypt-button{font-family:"Orbitron",sans-serif;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:13px;
              width:100%;border:0;border-radius:6px;padding:14px;cursor:pointer;color:#05070F;background:linear-gradient(135deg,#5CF1FF 0%,#2A7FFF 100%)}
            .staticrypt-form .staticrypt-decrypt-button:hover{filter:brightness(1.08)}
            .staticrypt-error{display:none;margin:12px 0 0;color:#FF2ED1;font-size:13px}
            .staticrypt-error.show{display:block}
            .staticrypt-site{margin:18px 0 0;font-size:12px;color:#7C8FB5}
            .staticrypt-site a{color:#2A7FFF;text-decoration:none}
            .hidden{display:none!important}
            .staticrypt-spinner-container{height:100%;display:flex;align-items:center;justify-content:center}
            .staticrypt-spinner{display:inline-block;width:2rem;height:2rem;border:.25em solid #2A7FFF;border-right-color:transparent;border-radius:50%;animation:spinner-border .75s linear infinite}
            @keyframes spinner-border{100%{transform:rotate(360deg)}}
</style>
    </head>
